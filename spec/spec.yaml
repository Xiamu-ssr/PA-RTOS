meta:
  version: '1.0'
  title: 豆豆 · Spec
  subtitle: OpenClaw · 4.4.2
layout:
  width: 1100
  height: 720
  padding: 16
ui:
  overview: |-
    一个豆豆，多个入口与手脚。

    本体部署在 Linux、Mac、Windows 三者之一。
    Android、Mac、Windows 连接同一本体；Linux 不做连接端。
    安装包与线上切换状态以 Release 和验收记录为准。
zones:
  app:
    label: 产品
    color: '#2faa7a'
  core:
    label: 运行
    color: '#3b82f6'
  device:
    label: 设备
    color: '#9466cf'
  third:
    label: 服务
    color: '#f08a3c'
kinds:
  cmd:
    label: 指令
    color: '#3b82f6'
  data:
    label: 个人数据
    color: '#f59e0b'
  result:
    label: 结果
    color: '#10b981'
  event:
    label: 进度/上线
    color: '#8b5cf6'
domains:
  - id: app
    name: 豆豆 App
    icon: 🧸
    zone: app
    rect:
      - 1
      - 21
      - 27
      - 56
    role: Windows、Mac、安卓共用一个豆豆；底部为聊天、动态、交办、书架、资源库五个图标。Linux 只提供本体部署；iOS 暂不做。
    chips:
      - id: app_chat
        name: 聊天
        icon: 💬
        desc: 持续对话
        doc: |-
          - 同一个主会话，跨端继续；忙时能插话、纠正或停止。
          - 不设旁聊和侧边抽屉。头像与右上设置进入同一伙伴页；聊天圆框直径 82.5，名字轻柔、紧贴圆框下方；顶部悬浮，不挤占阅读面积。 我的账户可切换 Cloud 地址；桌面配置入口首屏可达，本机离线仍能进入权限与连接诊断。
          - 图片直接看，音视频直接播，文档与网页在应用内打开。
          - 选项、连接应用、系统授权、能力申请都用对话卡片；卡片显示真实完成状态，可重试、拒绝或稍后处理。
          - 讨论先引用到输入框，用户编辑后发送。自己的消息和豆豆回复都可选中局部文字复制或引用；多条选段可逐条移除，与正文、附件、动态/书籍引用一起发送，只有引用也可发送。历史保存实际选段和原发言方，不建第二份引用库。
      - id: app_goals
        name: 交办
        icon: 🎯
        desc: 做成目标，持续照看
        doc: |-
          - 用户交办与豆豆自己的阅读、研究、创作共用任务机制，以发起者区分；自主计划默认收在角色页，不挤进用户交办。
          - 统一展示名称、刚完成、下一步；两段摘要各最多 40 字，优先保留关键数字，详情保留全文。有量化依据时加右侧小圆环。何时再醒、等什么、何时结束仍在同一条记录中维护。
          - 到时间或条件满足才推进；未完成不等于无限循环。等待授权、设备或外部结果时停止空转。
          - 有明确交付的用户任务待用户反馈后完成；长期照看按约定继续。用户暂停或取消后停止安排。
      - id: app_feed
        name: 动态
        icon: 📰
        desc: 按兴趣更新事实
        doc: |-
          - 宁缺毋滥：保留来源，合并重复新闻，突出实质后续；区分事实与豆豆的判断。
          - 原文节选和图片为主体；浏览、点赞、评论只展示真实数量，未知留空。评论展开阅读，聊一聊则引用进主聊天。
          - 北京时间每日 08:00、08:30、09:00、09:30、10:00、12:00、14:00、16:00、18:00、20:00 自动更新，共十次，22:00 截止。可以暂停或手动刷新。
          - 动态有更新不等于推送通知。值得讨论的内容先引用到输入框，发送后进入主会话。
      - id: app_books
        name: 书架
        icon: 📚
        desc: 原文 · 阅读笔记 · 一起经历
        doc: |-
          - 替代点子栏目；原文只读，笔记可修订，共同经历链接到真实对话与作品。
          - 每本书一个目录：source、notes.md、shared.md、reading.md；详见 Memory 节点。
          - 同时主读一本；默认每日一次后台阅读，最多 10 分钟，忙时顺延；按进度续读，不假装读过整本书。
          - 有新依据时修改当前看法并保留修订时间与原因；每周只回看本周有变化或待解问题的笔记。
          - 加号进入聊天，请豆豆找书；只从可合法获取的来源导入原文，优先 EPUB。不预置空书壳。
          - 真实封面与书名；笔记、共读各一个按钮，其他区域打开原文。阅读器支持章节、字号、纸色和续读；用户阅读位置与豆豆进度分别保存。豆豆日记有内容才写。
      - id: app_library
        name: 资源库
        icon: 🗃
        desc: 第五个主入口
        doc: |-
          - 从底部导航和聊天成果卡打开；按类型筛选、分页加载，卡片只放类型图标和短名称。图片与阅读缓存设上限。
          - 原文、阅读笔记与书架引用不重复复制到成果库；绘画、音乐、视频保存为可播放、可查看的作品。
      - id: app_activity
        name: 豆豆
        icon: 🎛
        desc: 伙伴 · 设备 · 配置
        doc: |-
          - 稳定的个性与兴趣，诚实、有判断，不因用户观点改变就无条件附和。
          - 豆豆与我的账户相依排列，名字在圆形头像下；账户圆为豆豆的 70%，贴右侧、不旋转。点击豆豆选择豆芽、小火龙或小鲸鱼，仅伙伴页随角色换底色，聊天头像与音色同步；设备以本机/品牌命名，重名加字母。点击画面放大，双击设备看详情。预览每秒最多一帧、离开即停；无桌面的 Cloud 展示真实状态。
          - 人物记忆用可拖动关系图，其他经历按领域分组，可查看、纠正和删除；图谱由同一 Markdown 派生，不另建数据库。技术日记与 Dreaming 报告不陈列为个人记忆。
      - id: app_settings
        name: 设置
        icon: ⚙️
        desc: 与头像共用伙伴页
        doc: |-
          - 客户端按对话、图像、音乐、TTS、视频搜索与选择本体提供的模型；不添加供应商、Key 或端点。
          - 模型页为两列三行：五类模型与一个刷新目录入口。配置顺序为模型、Soul、记忆、连接器。
          - 默认对话为 DeepSeek V4.1 Flash；媒体选择按类别保存，不清空其他选择。
          - CPA 当前接入对话、图像、TTS、视频；音乐暂无 CPA 接口契约，明确显示未接入。可选择与真实调用通过分别记录。
          - 豆芽 / 小火龙 / 小鲸鱼绑定 Gemini TTS 的 Achernar / Puck / Charon；其他模型只使用对应型号已配置的音色，不混传声音 ID。参考声音克隆尚未接通，不把参考音频字段当成可用功能。
          - 每种角色提供工作、玩耍两种与阅读短动画，生成视频本地播放；静帧为主，前台空闲偶尔播放，后台、输入、滚动或减少动态时停止。没有实时 3D 渲染。
          - 连接器分设备/应用：选择设备后看画面、归属和能力；应用市场支持搜索与分类。三端统一布局与行为，系统授权仍在对应设备完成。
      - id: app_onboard
        name: 首次使用
        icon: 👋
        desc: 聊着开始
        doc: |-
          - 连接页只放豆豆、Cloud 地址、配对码和连接按钮。成功连接时按钮扩散进入，仅播放一次。
          - 创建本体只在 Linux、Mac、Windows 支持；默认仅有一个活跃本体，不自动创建第二个。
          - 在对话里认识彼此，按需要给出连接应用、系统授权入口。设备选择归属，不把访问客户端和执行权限混为一谈。
  - id: core
    name: 豆豆 · OpenClaw
    icon: ⚙️
    zone: core
    rect:
      - 36
      - 21
      - 28
      - 56
    role: 一个人格、主会话与工作区；Linux / Mac / Windows 任选一个部署本体，节点只执行动作。
    chips:
      - id: cl_session
        name: 主会话
        icon: 💬
        desc: 一个 Session，持续 compact
        doc: |-
          - 使用固定稳定版上游 OpenClaw；豆豆插件与客户端独立维护，不复制内核到业务代码里。必要上游修改保持小补丁。
          - 主会话持续 compact，不自动 new/reset；阅读、动态和独立任务可用后台会话，但共享一个 Agent 的工作区。
          - 输入上下文/压缩预算目标不超过 272,000 tokens，最大输出目标不超过 128,000 tokens；实际按模型窗口与输出能力降低，并预留输出空间。
          - 本体支持 Linux、macOS 和 Windows；同一份运行时代码按平台打包，不是三个分裂的豆豆。Windows 本体可用原生 CLI，WSL 路径需明确告知。
          - 新版发布前迁移内容、记忆、账号与设备记录；Letta 和旧自研执行路径迁移验收后删除，不做双内核兼容。
          - 上游更新先在隔离环境验证长会话、插话、节点、记忆和断线恢复，再升级；不自动覆盖运行版本。
      - id: cl_memory
        name: Memory
        icon: 🗂️
        desc: 分类理解 · 真实经历 · 持续修订
        doc: |-
          所有路径相对同一本体工作区；Linux 生产目录为 `/srv/agent`。上游系统提示词未改，以下文件由 OpenClaw 按规则加入上下文或检索，并非全部常驻。

          ### 文件与目录

          ```text
          /srv/agent/
          ├─ AGENTS.md                 豆豆业务规则＋由代码生成的内容/工具约定
          ├─ SOUL.md                   稳定人格与判断原则；切换外观不改它
          ├─ USER.md                   用户概况与分类索引
          ├─ MEMORY.md                 精炼长期记忆；Dreaming 可合并/取代条目
          ├─ HEARTBEAT.md              原生心跳参考文件；原生心跳当前关闭
          ├─ DREAMS.md                 原生整理报告和 Dream Diary，产品隐藏
          ├─ memory/
          │  ├─ YYYY-MM-DD.md          原生工作记录，按日平铺
          │  ├─ people/<person-id>.md  人物字段、关系与事实
          │  ├─ experiences/<领域>.md  工作、居住、健康、投资等当前理解与经历
          │  ├─ self/reading.md        阅读判断的短摘要，链接原笔记
          │  ├─ .dreams/session-corpus/YYYY-MM-DD.txt  脱敏对话证据与来源
          │  └─ dreaming/
          │     ├─ light/YYYY-MM-DD.md 整理候选与证据报告
          │     ├─ rem/YYYY-MM-DD.md   关联主题与证据报告
          │     └─ deep/YYYY-MM-DD.md  晋升/拒绝与合并报告
          ├─ books/<book-id>/
          │  ├─ book.json              元数据与版本
          │  ├─ source.epub / source.* 有权使用的原文，只读
          │  ├─ text.md                原文提取文本，可重建
          │  ├─ reader-index.json      章节索引，可重建
          │  ├─ notes.md               豆豆当前观点、依据与修订历史
          │  ├─ shared.md              真实共同讨论/实践/作品的引用
          │  └─ reading.md             豆豆阅读位置、问题与下次计划
          ├─ data/
          │  ├─ journal/YYYY-MM-DD.md  产品日记；书架里可见
          │  ├─ feed/                  动态、关注说明、反馈
          │  ├─ goals/                 交办/自主计划的唯一主记录
          │  └─ library/               站点、文档与影音作品
          ├─ system/
          │  ├─ reader-state/<id>.json 用户阅读位置与偏好，独立于豆豆
          │  ├─ openclaw-runtime.json 主会话与后台会话的映射
          │  ├─ openclaw-receipts/     执行接收/完成/投递记录
          │  ├─ chat.jsonl             产品聊天展示记录
          │  └─ schedule*.json         调度、成功时间与顺延状态
          └─ .openclaw/
             ├─ openclaw.json          当前原生配置
             ├─ state/
             │  ├─ openclaw.sqlite    Cron、召回/整理插件状态与备份
             │  └─ openclaw-quarantine.sqlite  隔离记录
             ├─ agents/main/agent/
             │  └─ openclaw-agent.sqlite  原生会话与记忆检索索引
             └─ logs/、cache/、media/  日志、缓存和媒体
          ```

          该版本上游另支持 `IDENTITY.md`、可选启动 hook 的 `BOOT.md`、首次引导 `BOOTSTRAP.md`；工具约定放 `AGENTS.md` 的 Tools 部分。豆豆关闭自动 bootstrap 创建，不等于忽略已经存在的文件；没有启用 BOOT hook。凭据留在私有配置，不写入任何记忆或提示词。

          旧记忆导入已结束：删除旧原文、重复归档、导入进度及其派生缓存。分类记忆直接保存事实，不附来源文件或迁移链接；旧聊天中的导入指令不再执行。书籍删除包含原文、笔记、共读、阅读位置与派生索引，不挪到其他目录继续保存。

          ### 哪些会被检索

          原生 `memory_search` 当前启用 `sources: [memory]`，默认索引 **`MEMORY.md`、`USER.md` 和 `memory/` 下递归的 Markdown**。人物、领域与自身阅读摘要在这个范围内；配置也显式列出这三个深层目录。检索返回片段、路径和行号，按需读取，不把整个目录塞进上下文。

          `SOUL.md`、`AGENTS.md`、`HEARTBEAT.md`、根目录 `DREAMS.md`、`books/`、`data/journal/`、`imports/` 不属于当前默认检索范围。会话 transcript 搜索未启用；Dreaming 读取对话候选是另一条机制，不能混为一谈。书籍由 books 工具单独查原文和笔记。

          当前上游会枚举 `memory/dreaming/` 报告，但标记为 system 来源；它们不作为长期事实晋升来源。当前版本没有正式的默认目录排除配置，所以不宣称这些报告完全不可能出现在检索中。

          ### 日记与“污染”

          原生日常记录保存发生过的事，分类记录维护现在对人的理解，两者职责不同。每天一个文件不是自动逐句抄聊天：仍由 Agent 按需写入；压缩前 flush 也可能补记。产品日记只在有真实经历时写 `data/journal/`，不会复制工作日志来凑内容。

          旧日常记录可能保留已经变化的事实。当前分类记录优先，保留事实时间和不确定性，变化时更新当前状态与索引；不靠“全是日记”代替人物/经历维护。4.3 给业务自动任务加原生 internal_system 来源标记，避免后台提示词及其回复被当成用户事实晋升。上游来源判定属于内部机制，不要求个人记忆展示来源段；文件维护仍须遵守内容约定。

          ### 谁负责维护

          - 聊天获知变化：Agent 修订 `memory/people/`、`memory/experiences/`，同步 `USER.md` 的短索引。人物 id/name 必填，其余未知留空；图谱由同一 Markdown 派生。
          - “一起经历”：生成的 `AGENTS.md` 内容约定要求真实讨论/实践后先 `books.get`，再带 revision 更新该书 `shared.md`。这靠提示词和工具执行，不是看到用户打开书就自动登记共同经历。
          - 阅读或共同讨论推翻旧观点：修订原书 `notes.md`，同步 `memory/self/reading.md` 的短索引；每周定向回看有变化/待验证的笔记。不搬整本书到记忆。
          - Dreaming：每天 03:00 做 Light / REM / Deep。Deep 经证据和来源门槛合并或替代 `MEMORY.md` 条目，并记录整理报告/状态；可更新日常记录的受管块。它不会替豆豆遍历修改 `USER.md`、全部分类与所有书籍笔记。

          原文/分类条目是事实依据，摘要、索引和 UI 可重建；没有第二套影子记忆库。
      - id: cl_skills
        name: Skill
        icon: 🛠
        desc: 复用做事的方法
        doc: |-
          - 使用 OpenClaw 原生 Skill 与插件扩展，不重新维护一套工具发现体系。
          - 用户事实留在分类记忆，阅读观点留在笔记，可复用方法才成为 Skill。
      - id: cl_wake
        name: 主动推进
        icon: ⏰
        desc: 持续兴趣 · 可靠交办 · 适时分享
        doc: |-
          人格决定兴趣与判断，交办记录保存下一步，定时与事件负责唤醒。后台做过事与此刻值得告诉用户，是两件事。

          ### 当前所有自动入口

          | 入口 | 何时运行 | 使用哪个上下文 |
          | --- | --- | --- |
          | 主动推进 | 全天每 30 分钟 | 主会话；内部任务消息 |
          | 交办跟进 | 各自 cadence / nextWake；有效任务才推进 | 主会话；内部任务消息 |
          | 明确提醒 | 用户约定时间 | 主会话；内部任务消息 |
          | 动态 | 08:00、08:30、09:00、09:30、10:00、12:00、14:00、16:00、18:00、20:00 | 每次新后台会话；手动刷新同路 |
          | 阅读 / 回看 | 每日 10:00 / 周日 11:00 | 每次新后台会话；聊天忙时顺延，最多 10 分钟 |
          | 授权完成 / 任务结果 / 已接入的股票铃事件 | 有真实事件到达 | 恢复相应任务或进入主会话，不空转轮询模型 |
          | 原生 Dreaming | 每天 03:00，一次三阶段 sweep | 独立整理；叙事与合并用新鲜上下文，不向聊天发回复 |
          | 压缩前 memory flush | 正在执行的会话接近压缩阈值 | 当前会话的静默保存副本；不是另一个定时任务 |
          | 工具委托的后台/子任务 | 本次执行明确创建后 | 对应独立任务；不是天然持续唤醒 |
          | 健康同步 / 草稿清理 | 每 3 小时 / 每日 04:00 | 普通代码，不调用 LLM |

          原生 heartbeat 的 `every: 0m`，已关闭；没有另开一套原生心跳叠加。原生还支持外部 webhook/频道、原生 Cron、循环/原生 Goal 等入口，但只有实际配置或创建后才运行，不把工具“支持”算成已开启。当前没有另加这些自动任务。

          ### 会话与提示词

          业务系统规则由 `spec/prompts/openclaw/system-prompt.md` 和代码里的内容约定生成到 `AGENTS.md`，连同 `SOUL.md` / `USER.md` / `MEMORY.md` 等由上游装入工作区上下文；**OpenClaw 的默认系统提示词不改**。

          主动推进、交办、动态、阅读用对应 Markdown 生成一次 `chat.send.message`，以消息输入推理，不冒充另一份系统提示词。4.3 标记这些输入来自 internal_system；真实用户聊天保持外部用户来源。标签控制来源判断，不把主会话变成新会话。

          主会话始终连续 compact。动态/阅读每次开新的 `task:<UUID>` 后台会话，带有限近期主聊天摘要，共享同一个工作区；运行结束释放订阅，记录仍可追溯，不能说会话文件自动消失。它们不会把整段过程塞回主聊天，能更新动态/书架/记忆等共享文件；有需要才通过明确结果或后续检索影响主聊。

          ### 用量与打扰

          同一个定时任务运行时不重入；本次不新增全局后台并发限制，也不改其他任务频率。固定 Feed 从 28 次降为 10 次是次数约束，不是每次推理轮数约束。

          Dreaming 一次 sweep 不等于一次模型调用：Light/REM 可各写一次叙事，Deep 可按有证据的候选组做合并，并在有晋升时写叙事；空候选可不调用。它共享模型额度，实际次数看活动/原生日志，不假装免费。

          优先用户消息和到期交办。自主计划最多三个；等待权限、设备或外部结果时停下。通知先去重、免打扰和预算，再判断结果/变化/作品是否值得分享；每日阅读不要求每日推送。通知限额不等于模型预算。
  - id: model
    name: 模型
    icon: 🧠
    zone: third
    rect:
      - 36
      - 1
      - 28
      - 12
    role: 本体管理 CPA 目录与凭据；连接端按对话、图像、音乐、TTS、视频五类选择模型。
    chips: []
    compact: true
    doc: |-
      - 部署使用 CPA_BASE_URL / CPA_API_KEY 或私有 system/cpa.json；客户端不填写模型凭据。
      - 默认对话模型为 DeepSeek V4.1 Flash；全目录按已确认类别展示和搜索，未确认能力不伪装成可用。
      - 图像、TTS、视频有对应协议与原生工具；音乐暂无 CPA 接口契约，入口显示未接入。
      - 目录读取、可选择、真实调用成功与余额分别判断；少量探针不代表全目录或全部参数验证。保存失败保留已确认选择与用户输入。
  - id: conn
    name: 连接器
    icon: 🧩
    zone: third
    rect:
      - 72
      - 1
      - 27
      - 26
    role: 按服务接入，使用相应账号授权。
    chips:
      - id: conn_services
        name: 信息与服务
        icon: 🔗
        desc: 邮箱 · 阅读 · 搜索等
        doc: |-
          - 通过 OpenClaw 插件/MCP 接入，保留现有服务账号与能力。
          - 支持 OAuth 的服务用登录授权；其余只展示必要字段与操作指引。
          - 新连接器能力需要真实实现与验证，不能只加一张授权卡就声称接通。
        catalog: connectors
      - id: conn_pay
        name: 支付 · 待接入
        icon: 💳
        desc: 付款 · 回执 · 退款
        doc: |-
          - 作为连接器接入支付服务，按通道完成授权与付款，回写订单结果。
          - 支付成功与交办完成分开；商户覆盖和自主付款范围随通道确定。
  - id: dev
    name: 设备
    icon: 🔌
    zone: device
    rect:
      - 72
      - 31
      - 27
      - 46
    role: Windows、Mac、安卓是访问端与可授权节点；本体显式指定设备与动作，节点不运行另一份人格和独立记忆。
    chips:
      - id: dev_android
        name: Android
        icon: 📱
        desc: 短信 · 位置 · 健康 · App
        doc: |-
          - 连接同一本体，提供授权的短信、位置、通知、健康及手机操作；不在手机上启动独立 Harness。
          - 优先复用上游第三方发行路径的无障碍手机操作；Health Connect 等缺口按节点扩展补齐，按真机验收，不按功能名判断等价。
        pills:
          - 只读
          - 读写
      - id: dev_mac
        name: Mac
        icon: 💻
        desc: 文件 · 屏幕 · 命令
        doc: |-
          - 复用原生节点与本地运行时；文件、命令、浏览器、Computer Use 按系统权限开放。
          - 创建本体与连接已有本体是显式选择；连接模式不启动另一个 Gateway。
        pills:
          - 只读
          - 读写
      - id: dev_windows
        name: Windows
        icon: 🖥️
        desc: 文件 · 屏幕 · 命令
        doc: |-
          - 复用 OpenClaw 节点、命令执行与浏览器代理；扩展安装在此电脑的浏览器上，Linux 本体也可操作。
          - Windows 完整桌面控制走上游实验性 cua-computer 路径，需在真机验证截图、输入、窗口与交互会话；不能用“在线”代替可操作。
        pills:
          - 只读
          - 读写
    doc: |-
      - 设备归属由提示词约束；用户设备允许当前明确任务的 Computer Use / Phone Use。
      - 连接应用的本机页统一显示归属、能力、授权与连接状态，头像控制台不重复设置；云端确认接入后才显示在线。
      - 豆豆设备全权限，可接受改坏系统；账号身份与支付能力由实际接入决定。
